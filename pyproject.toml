[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finxum"
version = "0.1.0"
description = "Financial risk analysis and invoice intelligence prototype"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
